name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  multiplatform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run common tests and compile supported targets
        run: >
          ./gradlew
          :secure-preferences:jvmTest
          :secure-preferences:compileDebugKotlinAndroid
          :secure-preferences:compileKotlinJs
          :secure-preferences:compileKotlinWasmJs
          :secure-preferences:compileKotlinIosX64
          :secure-preferences:compileKotlinIosSimulatorArm64
          :secure-preferences:compileTestKotlinIosX64
          :secure-preferences-koin:compileDebugKotlinAndroid
      - name: Run Android Keystore and Koin instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :secure-preferences-koin:connectedDebugAndroidTest
