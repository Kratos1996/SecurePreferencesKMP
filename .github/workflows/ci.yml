name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests and compile Android artifacts
        run: ./gradlew :secure-preferences:testDebugUnitTest :secure-preferences:compileDebugKotlinAndroid :secure-preferences-koin:compileDebugKotlinAndroid
