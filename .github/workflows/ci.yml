name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  common-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run common tests and Android compilation
        run: ./gradlew :secure-preferences:allTests :secure-preferences:compileDebugKotlinAndroid :secure-preferences-koin:compileDebugKotlinAndroid
